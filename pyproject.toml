[project]
name = "llama-loader"
version = "0.1.0"
description = "A lightweight CLI for managing and launching llama.cpp models with profiles and configurable arguments."
readme = "README.md"
authors = [{name = "William Gabriel Schossler", email = "gabrielschossler.principal@gmail.com"}]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
llama-loader = "llama_loader.loader:main"