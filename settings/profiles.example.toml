# llama-loader profiles.
#
# Copy/Rename this file to "profiles.toml" and set your own profiles.
# Profiles are reusable groups of llama.cpp arguments.
#
# Flags with a value:
# --threads = 6
#
# Flags without a value:
# --jinja = ""
#
# An empty string tells llama-loader to emit only the flag itself:
#     --jinja
#
# Model-specific arguments can override values defined here.


# Arguments applied to every model by default.
#
# Keep here the settings that rarely change between models.
# More specific settings can be placed in a model TOML or in another profile.
[default]
--fit = "on"             
--agent = ""              
--jinja = ""              
--kv-unified = ""
--flash-attn = "on"

--no-mmproj-offload = ""
--spec-type = "ngram-mod"
--cache-type-k = "q8_0"
--cache-type-v = "q8_0"

--threads = 6
--parallel = 1
--verbosity = 3

--port = 9931
--host = "127.0.0.1"
--ctx-checkpoints = 2
--sleep-idle-seconds = 900



# Example profile with sampling parameters and reasoning disabled.
#
# Run a model with this profile when you want these values to override
# the corresponding defaults or model configuration.
[reasoning-off]
--temp = 1.00
--top-p = 0.95
--top-k = 20
--min-p = 0.05

--repeat-penalty = 1.0
--presence-penalty = 0.0

--reasoning = "off"


# Example sampling profile.
#
# Profiles do not need to contain every argument. Only the values declared
# here are merged into the final llama.cpp arguments.
[balanced]
--temp = 0.60
--top-k = 64
--top-p = 0.90
--min-p = 0.05
--repeat-penalty = 1.1


# Example profile for models that support configurable reasoning effort.
[reasoning-xhigh]
--temp = 1.00
--top-p = 0.95
--top-k = 20
--min-p = 0.0

--repeat-penalty = 1.0
--presence-penalty = 0.0

--reasoning = "on"
--reasoning-preserve = ""
--reasoning-effort = "xhigh"